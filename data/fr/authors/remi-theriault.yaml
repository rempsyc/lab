role: Professeur adjoint de psychologie et directeur du laboratoire SAGE
bio: >-
  Rémi Thériault est professeur adjoint de psychologie à l’Université du Québec
  à Rimouski et directeur du laboratoire SAGE. Ses recherches portent sur les
  identités sociales, la cognition implicite, la prosocialité, l’empathie et
  l’autorégulation.
interests:
  - Empathie
  - Attitudes implicites
  - Autorégulation
  - Moralité
  - Rêves
  - Identité sociale
  - Science ouverte et reproductible
